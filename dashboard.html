<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JChat - Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d0d1a;
      --surface: #1a1a2e;
      --surface2: #252542;
      --primary: #9b59b6;
      --primary-hover: #af6dc9;
      --accent: #bb86fc;
      --text: #e0e0e0;
      --text-muted: #8888aa;
      --border: #2a2a44;
      --error: #cf6679;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 22px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-actions span {
      font-size: 14px;
      color: var(--text-muted);
    }

    .btn-small {
      padding: 7px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }

    .btn-small-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-small-primary:hover { background: var(--primary-hover); }

    .btn-small-outline {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-small-outline:hover { background: var(--surface2); }

    /* Layout */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h2 {
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text-muted);
    }

    .sidebar-search {
      padding: 12px 18px;
    }

    .sidebar-search input {
      width: 100%;
      padding: 9px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .sidebar-search input:focus {
      border-color: var(--primary);
    }

    .sidebar-search input::placeholder { color: #555577; }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      cursor: pointer;
      transition: background .15s;
      border-bottom: 1px solid rgba(42,42,68,.5);
    }

    .chat-item:hover { background: var(--surface2); }
    .chat-item.active { background: var(--surface2); border-left: 3px solid var(--primary); }

    .chat-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
      flex-shrink: 0;
    }

    .chat-avatar.group {
      background: var(--accent);
      font-size: 14px;
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .chat-preview {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-meta {
      text-align: right;
      flex-shrink: 0;
    }

    .chat-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .chat-unread {
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
    }

    /* Main chat area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .main-placeholder h2 {
      font-size: 22px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .main-placeholder p {
      font-size: 14px;
      color: #555577;
      max-width: 320px;
    }

    .main-placeholder .icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: .4;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .sidebar { width: 100%; }
      .main { display: none; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>JChat</h1>
    <div class="header-actions">
      <span id="user-email"></span>
      <button class="btn-small btn-small-outline" id="logout-btn">Sign Out</button>
    </div>
  </div>

  <div class="layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Chats</h2>
      </div>
      <div class="sidebar-search">
        <input type="text" placeholder="Search chats..." id="search-chat">
      </div>
      <div class="chat-list" id="chat-list">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- Main area -->
    <div class="main">
      <div class="main-placeholder">
        <div class="icon">&#128172;</div>
        <h2>Select a chat</h2>
        <p>Choose a conversation from the sidebar to start messaging.</p>
      </div>
    </div>
  </div>

  <script>
    // Check auth
    const session = JSON.parse(localStorage.getItem('jchat_session'));
    if (!session) {
      window.location.href = 'index.html';
    }

    document.getElementById('user-email').textContent = session.email;

    document.getElementById('logout-btn').addEventListener('click', function () {
      localStorage.removeItem('jchat_session');
      window.location.href = 'index.html';
    });

    // Mock chat data
    const chats = [
      { name: 'Alex Rivera', preview: 'Sounds good, let me know when you\'re free!', time: '2m', unread: 3, group: false },
      { name: 'Jessica Chen', preview: 'I\'ll send over the docs by EOD', time: '14m', unread: 0, group: false },
      { name: 'Marcus Kim', preview: 'Great seeing you yesterday!', time: '1h', unread: 1, group: false },
      { name: 'Design Team', preview: 'Sophie: Mockups are ready for review', time: '3h', unread: 5, group: true },
      { name: 'Squad Devs', preview: 'Eli: PR is up for the auth module', time: '5h', unread: 0, group: true },
      { name: 'Sarah Mitchell', preview: 'Thanks! I appreciate the help', time: '1d', unread: 0, group: false },
      { name: 'Project Alpha', preview: 'David: Meeting rescheduled to 3pm', time: '2d', unread: 2, group: true },
      { name: 'Emily Park', preview: 'Happy birthday!! 🎉', time: '3d', unread: 0, group: false },
    ];

    function renderChats(filter = '') {
      const list = document.getElementById('chat-list');
      const q = filter.toLowerCase();
      const filtered = chats.filter(c => c.name.toLowerCase().includes(q));

      list.innerHTML = filtered.map(c => `
        <div class="chat-item" onclick="selectChat(this)">
          <div class="chat-avatar ${c.group ? 'group' : ''}">${c.group ? '#' : c.name.charAt(0)}</div>
          <div class="chat-info">
            <div class="chat-name">${c.name}</div>
            <div class="chat-preview">${c.preview}</div>
          </div>
          <div class="chat-meta">
            <div class="chat-time">${c.time}</div>
            ${c.unread ? `<div class="chat-unread">${c.unread}</div>` : ''}
          </div>
        </div>
      `).join('');
    }

    renderChats();

    document.getElementById('search-chat').addEventListener('input', function () {
      renderChats(this.value);
    });

    function selectChat(el) {
      document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
    }
  </script>
</body>
</html>
